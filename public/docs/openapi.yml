openapi: 3.0.3
info:
  title: Farmapremium API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Development

tags:
  - name: Users
  - name: Tasks

paths:
  /api/users:
    get:
      tags: [Users]
      summary: List all users
      operationId: listUsers
      responses:
        '200': { description: Successful response }

    post:
      tags: [Users]
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200': { description: User created }
        '400': { description: Validation error }
        '409': { description: Email already exists }

  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/TaskStatusQuery'
        - $ref: '#/components/parameters/TaskPriorityQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200': { description: Successful response }
        '400': { description: Invalid parameter }

    post:
      tags: [Tasks]
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200': { description: Task created }
        '400': { description: Validation error }

  /api/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get task details by ID
      operationId: getTaskById
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200': { description: Task details }
        '400': { description: Invalid task ID }
        '404': { description: Task not found }

    put:
      tags: [Tasks]
      summary: Update an existing task
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200': { description: Task updated }
        '400': { description: Validation error }
        '404': { description: Task not found }

    delete:
      tags: [Tasks]
      summary: Delete a task by ID
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200': { description: Task deleted }
        '400': { description: Invalid task ID }
        '404': { description: Task not found }

  /api/tasks/{id}/assign:
    patch:
      tags: [Tasks]
      summary: Assign a task to a user
      operationId: assignTask
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '200': { description: Task assigned }
        '400': { description: Validation error }
        '404': { description: Task or user not found }

components:
  parameters:
    TaskIdPath:
      name: id
      in: path
      required: true
      description: Task identifier (UUID). **Required**
      schema:
        type: string
        format: uuid

    TaskStatusQuery:
      name: status
      in: query
      required: false
      description: Filter by task status. **Optional**
      schema:
        type: string
        enum: [pending, in_progress, completed]

    TaskPriorityQuery:
      name: priority
      in: query
      required: false
      description: Filter by task priority. **Optional**
      schema:
        type: string
        enum: [low, medium, high]

    PageQuery:
      name: page
      in: query
      required: false
      description: Page number (1-based). **Optional**
      schema:
        type: integer
        minimum: 1

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page size. **Optional**
      schema:
        type: integer
        minimum: 1
        maximum: 100

  schemas:
    CreateUserRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
          description: User email. **Required**
        name:
          type: string
          description: User full name. **Required**

    CreateTaskRequest:
      type: object
      required: [title, description, priority]
      properties:
        title:
          type: string
          description: Task title. **Required**
        description:
          type: string
          description: Task description. **Required**
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority. **Required**
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: Due date (ISO 8601). Must not be in the past. **Optional**

    UpdateTaskRequest:
      type: object
      description: Partial update; all fields are optional.
      properties:
        title:
          type: string
          description: New title. **Optional**
        description:
          type: string
          description: New description. **Optional**
        status:
          type: string
          enum: [pending, in_progress, completed]
          description: New status. **Optional**
        priority:
          type: string
          enum: [low, medium, high]
          description: New priority. **Optional**
        dueDate:
          type: string
          format: date-time
          description: New due date (ISO 8601). **Optional**

    AssignTaskRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: Target user ID (UUID). **Required**
